worker_processes auto;

events {}

http {
  include mime.types;
  default_type application/octet-stream;

  # This nginx is the edge of the stack, so its peer address is the client. It
  # never trusts a client-supplied X-Forwarded-For (that would let anyone dodge
  # the rate limit below); behind another proxy, add that proxy's address with
  # set_real_ip_from instead.
  limit_req_zone $binary_remote_addr zone=mylimit:10m rate=10r/s;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    limit_req zone=mylimit burst=70 nodelay;

    # Vite fingerprints everything under /assets, so it can be cached forever.
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # Product photos and thumbnails keep their names between releases.
    location /products/ {
      add_header Cache-Control "public, max-age=604800";
      try_files $uri =404;
    }

    # The shell must be revalidated, otherwise users keep a stale index.html
    # pointing at hashed assets that a newer release has already removed.
    location = /index.html {
      add_header Cache-Control "no-cache";
    }

    location / {
      index index.html;
      try_files $uri /index.html;
    }

    # The storefront and the API are one origin in production: Express owns /api,
    # and socket.io keeps its own upgrade-capable route.
    location /api/ {
      # The API accepts product images up to 2 MB (multipart); nginx's 1 MB default would answer 413.
      client_max_body_size 3m;
      proxy_pass         http://server:3000;
      proxy_http_version 1.1;
      proxy_set_header   Host $http_host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
      proxy_pass         http://server:3000;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection $connection_upgrade;
      proxy_set_header   Host $http_host;
      proxy_set_header   X-Real-IP $remote_addr;
      proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
      root /usr/share/nginx/html;
    }
  }
}
