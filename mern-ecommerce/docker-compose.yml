services:
  web:
    build: web
    container_name: web
    ports:
      - '8080:8080'
    depends_on:
      server:
        condition: service_healthy
    networks:
      - app-network

  server:
    build: server
    container_name: server
    # No published port: web/nginx.conf proxies /api and /socket.io to server:3000.
    environment:
      - PORT=3000
      - BASE_API_URL=api
      - CLIENT_URL=http://localhost:8080
      # One reverse proxy (nginx) sits in front: count its X-Forwarded-For hop.
      - TRUST_PROXY=1
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET to a random string of at least 32 characters}
      - MONGO_URI=mongodb://mongo:27017/mern_ecommerce # Default Mongo URL & DB name when running project locally
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@example.com}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD for the seeded admin account}
    command: [
        'sh',
        '-c',
        'npm run seed:db "$$ADMIN_EMAIL" "$$ADMIN_PASSWORD" && npm start'
      ] # The admin account is created by the seed script on first start
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - app-network

  mongo:
    image: mongo:7
    container_name: mongodb
    command: mongod --quiet --logpath /dev/null
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - app-network

volumes:
  mongo-data:

networks:
  app-network:
    driver: bridge
